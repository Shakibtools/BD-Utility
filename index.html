<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BD Utility - Age Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #1f2937;
            min-height: 100vh;
        }

        header {
            background: #0f3d3e;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 600px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #0f3d3e;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="date"] {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0f3d3e;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .reset {
            margin-top: 10px;
            background: #6b7280;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 12px;
            text-align: center;
        }

        .result h3 {
            color: #166534;
            margin-bottom: 15px;
        }

        .age {
            font-size: 24px;
            font-weight: bold;
            color: #0f3d3e;
            margin-bottom: 12px;
        }

        .total-days {
            color: #4b5563;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 25px 10px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 24px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>BD Utility 🇧🇩</h1>
    <p>Simple & Useful Tools for Everyone</p>
</header>

<div class="container">

    <div class="card">

        <h2>🎂 Age Calculator</h2>

        <p class="subtitle">
            আপনার জন্মতারিখ দিন এবং আপনার সঠিক বয়স জানুন
        </p>

        <label for="dob">জন্মতারিখ / Date of Birth</label>

        <input type="date" id="dob">

        <button onclick="calculateAge()">
            Calculate Age
        </button>

        <button class="reset" onclick="resetCalculator()">
            Reset
        </button>

        <div class="result" id="result">

            <h3>আপনার বয়স</h3>

            <div class="age" id="ageResult"></div>

            <div class="total-days" id="daysResult"></div>

        </div>

    </div>

</div>

<footer>
    © 2026 BD Utility · Free Online Tools
</footer>

<script>

function calculateAge() {

    const dobInput = document.getElementById("dob").value;

    if (!dobInput) {
        alert("দয়া করে আপনার জন্মতারিখ নির্বাচন করুন।");
        return;
    }

    const birthDate = new Date(dobInput);
    const today = new Date();

    if (birthDate > today) {
        alert("জন্মতারিখ ভবিষ্যতের হতে পারে না।");
        return;
    }

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months--;

        const previousMonth = new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        );

        days += previousMonth.getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    const difference = today - birthDate;

    const totalDays = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    document.getElementById("ageResult").innerHTML =
        years + " বছর " +
        months + " মাস " +
        days + " দিন";

    document.getElementById("daysResult").innerHTML =
        "মোট প্রায় " + totalDays.toLocaleString() + " দিন";

    document.getElementById("result").style.display = "block";
}


function resetCalculator() {

    document.getElementById("dob").value = "";

    document.getElementById("result").style.display = "none";
}

</script>

</body>
</html>
