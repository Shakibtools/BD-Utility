<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Free Unit Converter by BD Utility. Convert length, weight, temperature, area, volume and time units easily.">

<title>Unit Converter | BD Utility</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f7f8;
    color:#173235;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#083b3b,#0f4c4c);
    color:white;
    text-align:center;
    padding:30px 15px;
}

.logo{
    font-size:32px;
    font-weight:800;
}

.logo span{
    font-size:17px;
}

header p{
    margin-top:8px;
    color:#dceeee;
    font-size:14px;
}

.container{
    width:92%;
    max-width:650px;
    margin:35px auto 50px;
}

.title{
    text-align:center;
    margin-bottom:28px;
}

.title h1{
    color:#0f4c4c;
    font-size:29px;
    margin-bottom:8px;
}

.title p{
    color:#687b7d;
    font-size:14px;
    line-height:1.6;
}

.converter{
    background:white;
    border:1px solid #dce5e5;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 30px rgba(15,76,76,.09);
}

.category-box{
    margin-bottom:22px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#43595b;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    padding:13px;
    border:1px solid #ccd8d9;
    border-radius:10px;
    background:white;
    color:#173235;
    font-size:16px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#0f4c4c;
}

.convert-row{
    display:grid;
    grid-template-columns:1fr 55px 1fr;
    gap:12px;
    align-items:end;
}

.swap{
    width:55px;
    height:47px;
    margin:0;
    border:none;
    border-radius:10px;
    background:#d9eeee;
    color:#0f4c4c;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

.swap:hover{
    background:#c8e5e5;
}

.result-box{
    margin-top:25px;
    padding:22px;
    border-radius:14px;
    background:#e8f7f0;
    text-align:center;
}

.result-label{
    font-size:13px;
    color:#587071;
    margin-bottom:8px;
}

.result{
    color:#0f4c4c;
    font-size:28px;
    font-weight:bold;
    word-break:break-word;
}

.formula{
    margin-top:9px;
    color:#718082;
    font-size:12px;
}

.quick{
    margin-top:25px;
    padding-top:22px;
    border-top:1px solid #e3eaea;
}

.quick h3{
    color:#0f4c4c;
    font-size:17px;
    margin-bottom:12px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.quick button{
    padding:10px 7px;
    border:1px solid #d7e2e2;
    background:#f5f8f8;
    color:#315759;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
}

.quick button:hover{
    background:#e8f1f1;
}

.back{
    display:block;
    text-align:center;
    margin:25px 0;
    color:#0f4c4c;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
}

footer{
    text-align:center;
    padding:25px 15px;
    background:white;
    border-top:1px solid #dde5e5;
    color:#718082;
    font-size:13px;
}

@media(max-width:600px){

    .container{
        width:92%;
    }

    .converter{
        padding:20px;
    }

    .convert-row{
        grid-template-columns:1fr;
    }

    .swap{
        width:100%;
        height:42px;
    }

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .result{
        font-size:24px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        BD Utility <span>🇧🇩</span>
    </div>

    <p>
        Simple &amp; Useful Tools for Everyone
    </p>

</header>


<div class="container">

    <div class="title">

        <h1>
            Unit Converter
        </h1>

        <p>
            Length, Weight, Temperature, Area, Volume এবং Time সহজে Convert করুন।
        </p>

    </div>


    <div class="converter">


        <!-- CATEGORY -->

        <div class="category-box">

            <label>
                Select Category
            </label>

            <select id="category" onchange="changeCategory()">

                <option value="length">
                    📏 Length
                </option>

                <option value="weight">
                    ⚖️ Weight
                </option>

                <option value="temperature">
                    🌡️ Temperature
                </option>

                <option value="area">
                    📐 Area
                </option>

                <option value="volume">
                    🧴 Volume
                </option>

                <option value="time">
                    ⏱️ Time
                </option>

            </select>

        </div>


        <!-- CONVERTER -->

        <div class="convert-row">


            <div>

                <label>
                    From
                </label>

                <input
                    type="number"
                    id="inputValue"
                    value="1"
                    step="any"
                    oninput="convert()"
                >

                <select
                    id="fromUnit"
                    onchange="convert()"
                ></select>

            </div>


            <button
                class="swap"
                onclick="swapUnits()"
                title="Swap Units"
            >
                ⇄
            </button>


            <div>

                <label>
                    To
                </label>

                <select
                    id="toUnit"
                    onchange="convert()"
                ></select>

            </div>

        </div>


        <!-- RESULT -->

        <div class="result-box">

            <div class="result-label">
                Result
            </div>

            <div
                class="result"
                id="result"
            >
                0
            </div>

            <div
                class="formula"
                id="formula"
            ></div>

        </div>


        <!-- QUICK VALUES -->

        <div class="quick">

            <h3>
                Quick Values
            </h3>

            <div class="quick-grid">

                <button onclick="setQuickValue(1)">
                    1
                </button>

                <button onclick="setQuickValue(10)">
                    10
                </button>

                <button onclick="setQuickValue(50)">
                    50
                </button>

                <button onclick="setQuickValue(100)">
                    100
                </button>

                <button onclick="setQuickValue(500)">
                    500
                </button>

                <button onclick="setQuickValue(1000)">
                    1000
                </button>

            </div>

        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Homepage
    </a>

</div>


<footer>

    © 2026 BD Utility · Free Online Tools

</footer>


<script>


const units = {

    length: {

        meter: {
            name:"Meter (m)",
            factor:1
        },

        kilometer: {
            name:"Kilometer (km)",
            factor:1000
        },

        centimeter: {
            name:"Centimeter (cm)",
            factor:0.01
        },

        millimeter: {
            name:"Millimeter (mm)",
            factor:0.001
        },

        mile: {
            name:"Mile (mi)",
            factor:1609.344
        },

        yard: {
            name:"Yard (yd)",
            factor:0.9144
        },

        foot: {
            name:"Foot (ft)",
            factor:0.3048
        },

        inch: {
            name:"Inch (in)",
            factor:0.0254
        }

    },


    weight: {

        kilogram: {
            name:"Kilogram (kg)",
            factor:1
        },

        gram: {
            name:"Gram (g)",
            factor:0.001
        },

        milligram: {
            name:"Milligram (mg)",
            factor:0.000001
        },

        pound: {
            name:"Pound (lb)",
            factor:0.45359237
        },

        ounce: {
            name:"Ounce (oz)",
            factor:0.028349523125
        },

        ton: {
            name:"Metric Ton (t)",
            factor:1000
        }

    },


    temperature: {

        celsius: {
            name:"Celsius (°C)"
        },

        fahrenheit: {
            name:"Fahrenheit (°F)"
        },

        kelvin: {
            name:"Kelvin (K)"
        }

    },


    area: {

        squareMeter: {
            name:"Square Meter (m²)",
            factor:1
        },

        squareKilometer: {
            name:"Square Kilometer (km²)",
            factor:1000000
        },

        squareCentimeter: {
            name:"Square Centimeter (cm²)",
            factor:0.0001
        },

        squareFoot: {
            name:"Square Foot (ft²)",
            factor:0.09290304
        },

        squareInch: {
            name:"Square Inch (in²)",
            factor:0.00064516
        },

        acre: {
            name:"Acre",
            factor:4046.8564224
        },

        hectare: {
            name:"Hectare (ha)",
            factor:10000
        }

    },


    volume: {

        liter: {
            name:"Liter (L)",
            factor:1
        },

        milliliter: {
            name:"Milliliter (mL)",
            factor:0.001
        },

        cubicMeter: {
            name:"Cubic Meter (m³)",
            factor:1000
        },

        gallon: {
            name:"US Gallon",
            factor:3.785411784
        },

        quart: {
            name:"US Quart",
            factor:0.946352946
        },

        pint: {
            name:"US Pint",
            factor:0.473176473
        },

        cup: {
            name:"US Cup",
            factor:0.2365882365
        }

    },


    time: {

        second: {
            name:"Second",
            factor:1
        },

        minute: {
            name:"Minute",
            factor:60
        },

        hour: {
            name:"Hour",
            factor:3600
        },

        day: {
            name:"Day",
            factor:86400
        },

        week: {
            name:"Week",
            factor:604800
        },

        month: {
            name:"Month (30 days)",
            factor:2592000
        },

        year: {
            name:"Year (365 days)",
            factor:31536000
        }

    }

};



function changeCategory(){

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("fromUnit");

    const to =
        document.getElementById("toUnit");


    from.innerHTML = "";
    to.innerHTML = "";


    const categoryUnits =
        units[category];


    Object.keys(categoryUnits).forEach(
        function(key){

            const option1 =
                document.createElement("option");

            option1.value = key;
            option1.textContent =
                categoryUnits[key].name;

            from.appendChild(option1);


            const option2 =
                document.createElement("option");

            option2.value = key;
            option2.textContent =
                categoryUnits[key].name;

            to.appendChild(option2);

        }
    );


    /*
        Select sensible default
    */

    const keys =
        Object.keys(categoryUnits);


    if(keys.length > 1){

        from.value = keys[0];
        to.value = keys[1];

    }


    convert();

}



function convert(){

    const category =
        document.getElementById("category").value;

    const value =
        parseFloat(
            document.getElementById("inputValue").value
        );

    const from =
        document.getElementById("fromUnit").value;

    const to =
        document.getElementById("toUnit").value;


    if(isNaN(value)){

        document.getElementById("result").textContent =
            "—";

        document.getElementById("formula").textContent =
            "Enter a value to convert.";

        return;

    }


    let result;


    /*
        TEMPERATURE
    */

    if(category === "temperature"){

        result =
            convertTemperature(
                value,
                from,
                to
            );

    }


    /*
        OTHER UNITS
    */

    else{

        const fromFactor =
            units[category][from].factor;

        const toFactor =
            units[category][to].factor;


        result =
            value * fromFactor / toFactor;

    }


    document.getElementById("result").textContent =
        formatResult(result) +
        " " +
        units[category][to].name;


    document.getElementById("formula").textContent =
        value +
        " " +
        units[category][from].name +
        " = " +
        formatResult(result) +
        " " +
        units[category][to].name;

}



function convertTemperature(
    value,
    from,
    to
){

    let celsius;


    if(from === "celsius"){

        celsius = value;

    }else if(from === "fahrenheit"){

        celsius =
            (value - 32) * 5 / 9;

    }else if(from === "kelvin"){

        celsius =
            value - 273.15;

    }


    if(to === "celsius"){

        return celsius;

    }

    if(to === "fahrenheit"){

        return (
            celsius * 9 / 5
        ) + 32;

    }

    if(to === "kelvin"){

        return celsius + 273.15;

    }

}



function formatResult(number){

    if(!Number.isFinite(number)){
        return "Error";
    }


    return number.toLocaleString(
        "en-US",
        {
            maximumFractionDigits:10
        }
    );

}



function swapUnits(){

    const from =
        document.getElementById("fromUnit");

    const to =
        document.getElementById("toUnit");


    const temp =
        from.value;

    from.value =
        to.value;

    to.value =
        temp;


    convert();

}



function setQuickValue(value){

    document.getElementById("inputValue").value =
        value;

    convert();

}



changeCategory();

</script>

</body>
</html>
